<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163c35"><title>어진 ESTIMATE 2.0</title><style>body{font-family:system-ui,sans-serif;background:#f3f5f4;margin:0;color:#192c28}header{background:#163c35;color:white;padding:22px 18px}h1{margin:0;font-size:23px}small{opacity:.8}.wrap{max-width:850px;margin:auto;padding:14px}.card{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}h2{font-size:17px;margin:0 0 12px}input,select,textarea,button{box-sizing:border-box;font:inherit;border:1px solid #ccd7d2;border-radius:9px;padding:10px;width:100%;background:white}label{font-size:13px;color:#53665e;display:block;margin:8px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.btn{background:#17634c;color:white;border:0;font-weight:700;margin-top:10px}.sub{background:#e8f1ed;color:#17634c;border:0}.danger{color:#a22;background:#fff2f2;border:0}.line{border-top:1px solid #e3e9e5;padding:12px 0}.line:first-child{border:0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sum{font-size:25px;font-weight:800;text-align:right;color:#17634c}.pill{display:inline-block;background:#e6f1eb;border-radius:30px;padding:6px 10px;margin:4px 4px 0 0;font-size:13px}.muted{font-size:12px;color:#63756c}.tabs{display:flex;gap:6px}.tabs button{font-size:13px;padding:9px 5px}.tabs .active{background:#17634c;color:white}.hide{display:none}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 4px;border-bottom:1px solid #ddd;text-align:right}td:first-child,th:first-child{text-align:left}@media print{header,.tabs,.no-print,.btn{display:none!important}.card{box-shadow:none;border:1px solid #ddd}body{background:white}} </style></head><body><header><h1>어진 ESTIMATE 2.0</h1><small>어진환경개발 · 견적 및 공정 관리</small></header><div class="wrap"><div class="tabs no-print"><button class="active" onclick="tab('estimate',this)">견적 작성</button><button onclick="tab('schedule',this)">공정 일정</button><button onclick="tab('print',this)">견적서 보기</button></div><section id="estimate"><div class="card"><h2>현장 정보</h2><div class="grid"><div><label>현장명</label><input id="site" placeholder="예: 삼산동 상가" oninput="save()"></div><div><label>고객명</label><input id="client" placeholder="고객명" oninput="save()"></div><div><label>연락처</label><input id="phone" type="tel" placeholder="연락처" oninput="save()"></div><div><label>면적 (평)</label><input id="area" type="number" min="0" step="0.1" placeholder="평수" oninput="save()"></div></div><label>공사 범위 (복수 선택)</label><div id="scopes"></div><div class="row"><input id="newscope" placeholder="공사 범위 추가"><button class="sub" onclick="addScope()">추가</button></div><label>현장 메모</label><textarea id="memo" rows="2" oninput="save()"></textarea></div><div class="card"><h2>견적 품목 선택</h2><div class="grid"><div><label>공종</label><select id="category" onchange="drawOptions()"></select></div><div><label>품목</label><select id="item"></select></div></div><button class="btn" onclick="addItem()">+ 품목 추가</button><p class="muted">품목을 추가한 후 수량과 단가를 직접 수정할 수 있습니다.</p></div><div class="card"><h2>견적 상세</h2><div id="lines"></div><div class="row"><button class="sub" onclick="customItem()">+ 직접 품목 추가</button><button class="sub" onclick="addFlat()">+ 평단가 품목 추가</button></div><label>부가세</label><select id="vat" onchange="save();drawLines()"><option value="0">별도 / 미포함</option><option value="10">10% 포함 계산</option></select><p class="muted">공급가액</p><div id="subtotal" class="sum"></div><p class="muted">최종 합계</p><div id="total" class="sum"></div></div><button class="btn" onclick="save();alert('이 기기에 저장되었습니다.')">저장하기</button><button class="sub" style="margin-top:8px" onclick="newEstimate()">새 견적 시작</button></section><section id="schedule" class="hide"><div class="card"><h2>공정 일정</h2><label>공정명</label><input id="task" placeholder="예: 철거 / 설비 / 목공"><div class="grid"><div><label>시작일</label><input id="start" type="date"></div><div><label>종료일</label><input id="end" type="date"></div></div><button class="btn" onclick="addTask()">+ 일정 추가</button><div id="tasks"></div></div></section><section id="print" class="hide"><div class="card"><h2>견적서</h2><p id="printInfo"></p><div class="tabs no-print"><button onclick="renderPrint(false)">고객용</button><button onclick="renderPrint(true)">내부관리용</button></div><div id="printTable"></div><p id="printTotal" class="sum"></p><p class="muted">견적 금액은 현장 확인 및 협의에 따라 변경될 수 있습니다.</p><button class="btn no-print" onclick="window.print()">인쇄 / PDF 저장</button></div></section></div><script>
const catalog={'철거':[ ['화장실 기본',250000,'식'],['화장실 욕조 포함',350000,'식'],['화장실 올철거',700000,'식'],['싱크대 철거',250000,'식'],['붙박이장·신발장·냉장고장',400000,'식'],['주방타일',150000,'식'],['현관타일',200000,'식'],['문선',100000,'식'],['문·문틀',60000,'개'],['몰딩·걸레받이',150000,'식'],['샷시',50000,'틀'],['강마루 철거',30000,'평'],['강화마루 철거',10000,'평'],['데코·디럭스타일',25000,'평'],['기본 내부철거',80000,'평']], '인건비·장비':[['인건비',250000,'인/일'],['미니포크레인',600000,'일']], '폐기물':[['혼합폐기물 집게차',1500000,'차'],['폐콘·타일 포터',250000,'차']], '인테리어':[['목공',0,'식'],['도배',0,'식'],['도장',0,'식'],['전기',0,'식'],['설비',0,'식'],['타일 시공',0,'식']], '기타':[['소모품비',0,'식'],['기업이윤',0,'식']]};
const defaultScopes=['내부철거','부분철거','전체철거','원상복구','바닥철거','화장실','주방','목공','도배','전기','설비','폐기물'];let data={items:[],tasks:[],scopes:[],extraScopes:[]},internal=false;const $=id=>document.getElementById(id),money=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){['site','client','phone','area','memo','vat'].forEach(k=>data[k]=$(k).value);localStorage.setItem('eojin-estimate-v2',JSON.stringify(data))}function tab(id,b){['estimate','schedule','print'].forEach(x=>$(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tabs:first-child button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='print')renderPrint(internal);if(id==='schedule')drawTasks()}function drawScopes(){ $('scopes').innerHTML=[...defaultScopes,...data.extraScopes].map(x=>`<label class="pill"><input type="checkbox" style="width:auto" ${data.scopes.includes(x)?'checked':''} onchange="toggleScope('${x}',this.checked)"> ${esc(x)}</label>`).join('')}function toggleScope(x,v){data.scopes=v?[...new Set([...data.scopes,x])]:data.scopes.filter(y=>y!==x);save()}function addScope(){let x=$('newscope').value.trim();if(x&&!defaultScopes.includes(x)&&!data.extraScopes.includes(x))data.extraScopes.push(x);$('newscope').value='';drawScopes();save()}function drawOptions(){$('item').innerHTML=catalog[$('category').value].map((x,i)=>`<option value="${i}">${esc(x[0])} · ${money(x[1])}/${x[2]}</option>`).join('')}function addItem(){let cat=$('category').value,x=catalog[cat][Number($('item').value)];data.items.push({name:x[0],price:x[1],unit:x[2],qty:1,cat});drawLines();save()}function customItem(){data.items.push({name:'새 품목',price:0,unit:'식',qty:1,cat:'직접 추가'});drawLines();save()}function addFlat(){data.items.push({name:'평단가 공사',price:0,unit:'평',qty:Number($('area').value)||1,cat:'직접 추가'});drawLines();save()}function changeItem(i,k,v){data.items[i][k]=['price','qty'].includes(k)?Math.max(0,Number(v)||0):v;save();drawTotals()}function removeItem(i){data.items.splice(i,1);drawLines();save()}function drawLines(){$('lines').innerHTML=data.items.length?data.items.map((x,i)=>`<div class="line"><div class="row"><input aria-label="품목명" value="${esc(x.name)}" oninput="changeItem(${i},'name',this.value)"><button class="danger" style="flex:0 0 52px" onclick="removeItem(${i})">삭제</button></div><div class="grid"><div><label>수량</label><input type="number" min="0" step="0.1" value="${x.qty}" oninput="changeItem(${i},'qty',this.value)"></div><div><label>단위 (평 / 식 / 개 등)</label><input value="${esc(x.unit)}" oninput="changeItem(${i},'unit',this.value)"></div><div><label>단가 (원)</label><input type="number" min="0" value="${x.price}" oninput="changeItem(${i},'price',this.value)"></div><div><label>금액</label><p id="lineTotal${i}"></p></div></div></div>`).join(''):'<p class="muted">아직 추가된 품목이 없습니다.</p>';drawTotals()}function drawTotals(){data.items.forEach((x,i)=>{let e=$('lineTotal'+i);if(e)e.textContent=money(x.price*x.qty)});let s=data.items.reduce((a,x)=>a+x.price*x.qty,0);$('subtotal').textContent=money(s);$('total').textContent=money(s*(1+Number($('vat').value)/100))}function addTask(){let name=$('task').value.trim(),start=$('start').value,end=$('end').value;if(!name||!start||!end||end<start)return alert('공정명과 시작일·종료일을 확인하세요.');data.tasks.push({name,start,end,done:false});$('task').value='';save();drawTasks()}function drawTasks(){$('tasks').innerHTML=data.tasks.map((t,i)=>`<div class="line"><label><input style="width:auto" type="checkbox" ${t.done?'checked':''} onchange="data.tasks[${i}].done=this.checked;save();drawTasks()"> ${esc(t.name)}</label><p class="muted">${t.start} ~ ${t.end}</p><button class="danger" onclick="data.tasks.splice(${i},1);save();drawTasks()">삭제</button></div>`).join('')||'<p class="muted">등록된 일정이 없습니다.</p>'}function renderPrint(isInternal){internal=isInternal;save();$('printInfo').textContent=`현장: ${data.site||'-'} / 고객: ${data.client||'-'} / 연락처: ${data.phone||'-'} / 면적: ${data.area||'-'}평 / 공사범위: ${data.scopes.join(', ')||'-'}`;let rows=data.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td></tr>`).join('');$('printTable').innerHTML=`<p><strong>${isInternal?'내부관리용':'고객용'} 견적서</strong></p><table><thead><tr><th>품목</th><th>수량</th><th>단가</th><th>금액</th></tr></thead><tbody>${rows}</tbody></table>${isInternal?`<p>현장 메모: ${esc(data.memo||'-')}</p><p>공정 일정: ${data.tasks.map(x=>esc(x.name)+' ('+x.start+'~'+x.end+')').join(', ')||'-'}</p>`:''}`;$('printTotal').textContent='총 견적 '+money(data.items.reduce((a,x)=>a+x.qty*x.price,0)*(1+Number(data.vat||0)/100))}function newEstimate(){if(!confirm('현재 견적을 지우고 새로 시작할까요?'))return;data={items:[],tasks:[],scopes:[],extraScopes:[]};['site','client','phone','area','memo'].forEach(k=>$(k).value='');$('vat').value='0';drawScopes();drawLines();save()}try{data={...data,...JSON.parse(localStorage.getItem('eojin-estimate-v2')||'{}')}}catch(e){};['site','client','phone','area','memo','vat'].forEach(k=>$(k).value=data[k]||'');$('category').innerHTML=Object.keys(catalog).map(x=>`<option>${x}</option>`).join('');drawOptions();drawScopes();drawLines();</script></body></html>
